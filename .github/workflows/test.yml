name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # The CPU build of PyTorch, a fraction of the CUDA build's download.
      - run: uv venv && uv pip install --torch-backend cpu -e . pytest
      - run: uv run --no-sync pytest
